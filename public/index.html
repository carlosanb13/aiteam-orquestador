<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AITeam</title>
    <link rel="icon" href="icon-192.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#1d1d1b" />
    <script>
      // Aplica el tema guardado antes de pintar, para que no parpadee.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('aiteam.theme') || 'oscuro';
        document.documentElement.dataset.accent = localStorage.getItem('aiteam.accent') || 'azul';
      } catch {}
    </script>
  </head>
  <body>
    <div class="layout" id="layout">
      <aside class="sidebar">
        <div class="brand">
          <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
            <path d="M9 16 23 10M9 16l14 6M23 10v12" stroke="currentColor" stroke-width="1.5" opacity=".35" />
            <circle cx="9" cy="16" r="5" fill="#d97757" />
            <circle cx="23" cy="10" r="5" fill="#10a37f" />
            <circle cx="23" cy="22" r="5" fill="#4285f4" />
          </svg>
          <span>AITeam</span>
          <span id="mockBadge" class="badge warn" hidden>simulación</span>
          <button id="settingsBtn" class="ghost icon-btn" title="Ajustes" aria-label="Ajustes"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        </div>

        <div class="sidebar-scroll">
          <div class="sidebar-title row-title">Proyectos <button id="addProjectBtn" class="small ghost" title="Añadir proyecto">+ Añadir</button></div>
          <div id="projectTree" class="project-tree"></div>
        </div>

        <div class="team-panel">
          <div class="sidebar-title row-title">Equipo y uso <button id="refreshUsage" class="small ghost" title="Actualizar el uso (consulta mínima a Claude)"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg></button></div>
          <div id="teamPanel"></div>
        </div>
      </aside>

      <main id="main"></main>

      <aside class="files-panel" id="filesPanel" hidden>
        <div class="files-head">
          <b>Archivos</b>
          <span class="muted small-text" id="filesRootLabel"></span>
          <button class="small ghost" id="filesClose" title="Cerrar"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <input id="filesFilter" placeholder="Filtrar archivos…" autocomplete="off" />
        <div id="filesTree" class="files-tree"></div>
        <div id="fileView" class="file-view" hidden></div>
      </aside>
    </div>

    <template id="addProjectTpl">
      <section class="panel narrow">
        <h1>Añadir un proyecto</h1>
        <p class="muted">Indica la carpeta de un repositorio git (con al menos un commit). Después podrás abrir conversaciones y tareas de equipo sobre él.</p>
        <form id="addProjectForm" class="form">
          <label>
            <span>Carpeta del proyecto</span>
            <input name="path" required placeholder="C:\Users\tu-usuario\proyectos\mi-app" autocomplete="off" />
          </label>
          <p class="error" data-form-error hidden></p>
          <button class="primary" type="submit">Añadir y abrir una conversación</button>
        </form>
      </section>
    </template>

    <template id="newRunTpl">
      <section class="panel narrow">
        <h1>Nueva tarea para el equipo</h1>
        <p class="muted">
          Describe lo que quieres conseguir. Una IA lo dividirá en subtareas, el equipo negociará quién hace cada una según sus
          puntos fuertes, trabajarán en paralelo en copias aisladas y se revisarán entre sí antes de integrar.
        </p>
        <form id="newRunForm" class="form">
          <label>
            <span>Carpeta del proyecto (repositorio git)</span>
            <input name="repoPath" required placeholder="C:\Users\tu-usuario\proyectos\mi-app" autocomplete="off" />
          </label>
          <label>
            <span>Objetivo</span>
            <textarea name="goal" rows="5" required placeholder="Ej.: Añade un sistema de login con email y contraseña, con tests y documentación."></textarea>
          </label>
          <fieldset>
            <legend>IAs que participan</legend>
            <div class="agent-pick" data-agent-pick></div>
          </fieldset>
          <div class="row">
            <label>
              <span>Coordinadora (divide el trabajo)</span>
              <select name="coordinator" id="coordinatorSel"></select>
            </label>
            <label>
              <span>Comando de verificación <em class="muted">(opcional)</em></span>
              <input name="testCommand" placeholder="npm test" autocomplete="off" />
            </label>
          </div>
          <label class="check"><input type="checkbox" name="review" checked /> Revisión cruzada entre IAs</label>
          <label class="check"><input type="checkbox" name="adversarial" /> Fase adversarial: una IA intenta romper el resultado (vulnerabilidades, casos límite) y otra lo corrige</label>
          <label class="check"><input type="checkbox" name="autoApprove" /> Empezar sin esperar a que apruebe el reparto</label>
          <p id="formError" class="error" hidden></p>
          <button class="primary" type="submit">Empezar</button>
        </form>
      </section>
    </template>

    <template id="newChatTpl">
      <section class="panel narrow">
        <h1>Nueva conversación con el equipo</h1>
        <p class="muted">
          Un chat donde hablas con todas tus IAs a la vez. Menciona a <b>@claude</b>, <b>@codex</b>, <b>@antigravity</b> o <b>@equipo</b>;
          ellas también pueden pedirse cosas entre sí. Trabajan sobre una copia aislada de tu proyecto y tú decides cuándo aplicar los cambios.
        </p>
        <form id="newChatForm" class="form">
          <label>
            <span>Carpeta del proyecto (repositorio git)</span>
            <input name="repoPath" required placeholder="C:\Users\tu-usuario\proyectos\mi-app" autocomplete="off" />
          </label>
          <fieldset>
            <legend>IAs en la conversación</legend>
            <div class="agent-pick" data-agent-pick></div>
          </fieldset>
          <p class="error" data-form-error hidden></p>
          <button class="primary" type="submit">Abrir conversación</button>
        </form>
      </section>
    </template>

    <dialog id="diffDlg" class="wide-dialog">
      <div class="dialog-head">
        <h2>Cambios</h2>
        <button class="ghost" data-close>Cerrar</button>
      </div>
      <div id="diffBody"></div>
    </dialog>

    <dialog id="settingsDlg">
      <form id="settingsForm" method="dialog" class="form">
        <h2>Ajustes</h2>
        <fieldset>
          <legend>Apariencia</legend>
          <div class="theme-grid" id="themeGrid"></div>
          <div class="muted small-text" style="margin:10px 0 6px">Color de acento</div>
          <div class="accent-row" id="accentRow"></div>
        </fieldset>
        <label>
          <span>Autonomía de las IAs</span>
          <select name="autonomy">
            <option value="edits">Solo editar archivos en su copia aislada (recomendado)</option>
            <option value="full">Control total: también ejecutar comandos sin pedir permiso</option>
          </select>
        </label>
        <div class="row">
          <label><span>Tiempo máximo por subtarea (min)</span><input name="taskTimeoutMinutes" type="number" min="1" max="240" /></label>
          <label><span>Rondas de corrección tras revisión</span><input name="maxFixRounds" type="number" min="0" max="5" /></label>
        </div>
        <div id="agentSettings"></div>
        <div class="shutdown-row">
          <div>
            <b>Apagar AITeam</b>
            <div class="muted small-text">Detiene el servidor. Se vuelve a abrir con el acceso directo.</div>
          </div>
          <button type="button" class="danger" id="shutdownBtn">Apagar</button>
        </div>
        <div class="dialog-actions">
          <button value="cancel" class="ghost">Cancelar</button>
          <button id="saveSettings" value="default" class="primary">Guardar</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
