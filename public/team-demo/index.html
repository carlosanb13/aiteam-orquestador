<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipo en acción</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="team-header">
    <h1>Equipo en acción</h1>
    <p class="team-credits">Demo construida en paralelo por Claude (HTML), Codex (JS) y Antigravity (CSS).</p>
  </header>

  <main id="team-demo" class="team-demo">
    <section class="task-panel" aria-labelledby="task-panel-title">
      <h2 id="task-panel-title">Lista de tareas</h2>

      <form id="task-form" class="task-form">
        <label for="task-input">Nueva tarea</label>
        <input id="task-input" class="task-input" type="text" name="task" autocomplete="off" required maxlength="120" placeholder="Escribe una tarea…">
        <button id="task-add" class="task-add" type="submit">Agregar</button>
      </form>

      <p id="task-count" class="task-count" aria-live="polite"></p>

      <ul id="task-list" class="task-list" aria-label="Tareas"></ul>

      <p id="task-empty" class="task-empty">Todavía no hay tareas. Agrega la primera.</p>
    </section>
  </main>

  <footer class="team-footer">
    <p>AITeam · Demo de colaboración multi-agente</p>
  </footer>
</body>
</html>
