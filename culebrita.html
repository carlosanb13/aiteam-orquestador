<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La culebrita</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101114; color: #f5f5f5; }
    main { width: min(94vw, 520px); text-align: center; }
    h1 { margin: 0 0 .5rem; }
    .score { display: flex; justify-content: space-between; margin: 1rem 0; font-weight: 700; }
    canvas { display: block; width: 100%; aspect-ratio: 1; background: #1b1d22; border: 2px solid #777; border-radius: 12px; touch-action: none; }
    button { padding: .7rem 1rem; border: 1px solid #888; border-radius: 9px; background: #292c32; color: inherit; font: inherit; cursor: pointer; }
    button:hover, button:focus-visible { background: #41454d; }
    .controls { display: grid; grid-template-columns: repeat(3, 64px); justify-content: center; gap: 6px; margin: 1rem auto; }
    .controls button { height: 56px; font-size: 1.4rem; padding: 0; }
    .controls [data-dir="up"] { grid-column: 2; }
    .controls [data-dir="left"] { grid-column: 1; }
    .controls [data-dir="down"] { grid-column: 2; }
    .controls [data-dir="right"] { grid-column: 3; }
    #message { min-height: 1.5em; }
    p { color: #bbb; }
  </style>
</head>
<body>
  <main>
    <h1>La culebrita</h1>
    <div class="score"><span>Puntos: <span id="score">0</span></span><span>Récord: <span id="best">0</span></span></div>
    <canvas id="board" width="480" height="480" aria-label="Tablero del juego"></canvas>
    <p id="message" role="status">Pulsa Empezar para jugar</p>
    <button id="start">Empezar / reiniciar</button>
    <button id="pause">Pausar</button>
    <div class="controls" aria-label="Controles táctiles">
      <button data-dir="up" aria-label="Arriba">↑</button>
      <button data-dir="left" aria-label="Izquierda">←</button>
      <button data-dir="down" aria-label="Abajo">↓</button>
      <button data-dir="right" aria-label="Derecha">→</button>
    </div>
    <p>Usa las flechas, WASD o los botones. En móvil también puedes deslizar el tablero. Espacio pausa.</p>
  </main>
  <script>
    'use strict';
    const canvas = document.querySelector('#board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.querySelector('#score');
    const bestEl = document.querySelector('#best');
    const messageEl = document.querySelector('#message');
    const size = 20;
    const cell = canvas.width / size;
    const vectors = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    let snake, food, direction, nextDirection, score, best = 0, timer = null, running = false, paused = false, turned = false;

    try { best = Number(localStorage.getItem('culebrita-best')) || 0; } catch (_) { /* El juego funciona sin almacenamiento. */ }
    bestEl.textContent = best;

    function draw() {
      ctx.fillStyle = '#1b1d22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff6376';
      if (food) { ctx.beginPath(); ctx.arc((food[0] + .5) * cell, (food[1] + .5) * cell, cell * .36, 0, Math.PI * 2); ctx.fill(); }
      if (snake) snake.forEach(([x, y], i) => {
        ctx.fillStyle = i ? '#78d79b' : '#adf0bf';
        ctx.fillRect(x * cell + 2, y * cell + 2, cell - 4, cell - 4);
      });
    }

    function placeFood() {
      const empty = [];
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        if (!snake.some(part => part[0] === x && part[1] === y)) empty.push([x, y]);
      }
      food = empty.length ? empty[Math.floor(Math.random() * empty.length)] : null;
    }

    function stop(message) {
      clearInterval(timer);
      timer = null;
      running = false;
      messageEl.textContent = message;
    }

    function tick() {
      direction = nextDirection;
      turned = false;
      const head = [snake[0][0] + direction[0], snake[0][1] + direction[1]];
      const eating = food && head[0] === food[0] && head[1] === food[1];
      const body = eating ? snake : snake.slice(0, -1);
      if (head[0] < 0 || head[0] >= size || head[1] < 0 || head[1] >= size || body.some(([x, y]) => x === head[0] && y === head[1])) {
        stop('Fin del juego. Pulsa Empezar para intentarlo otra vez.');
        return;
      }
      snake.unshift(head);
      if (eating) {
        score++;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          try { localStorage.setItem('culebrita-best', String(best)); } catch (_) { /* Opcional. */ }
        }
        placeFood();
        if (!food) stop('¡Ganaste! Llenaste todo el tablero.');
      } else snake.pop();
      draw();
    }

    function start() {
      clearInterval(timer);
      snake = [[10, 10], [9, 10], [8, 10]];
      direction = nextDirection = vectors.right;
      score = 0;
      scoreEl.textContent = score;
      turned = paused = false;
      running = true;
      placeFood();
      messageEl.textContent = '¡Come los puntos rojos!';
      draw();
      timer = setInterval(tick, 115);
    }

    function turn(name) {
      if (!running || paused || turned) return;
      const candidate = vectors[name];
      if (!candidate || candidate[0] === -direction[0] && candidate[1] === -direction[1]) return;
      nextDirection = candidate;
      turned = true;
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) { clearInterval(timer); timer = null; messageEl.textContent = 'Pausa'; }
      else { messageEl.textContent = '¡Sigue jugando!'; timer = setInterval(tick, 115); }
    }

    document.querySelector('#start').addEventListener('click', start);
    document.querySelector('#pause').addEventListener('click', togglePause);
    document.querySelectorAll('[data-dir]').forEach(button => button.addEventListener('click', () => turn(button.dataset.dir)));
    document.addEventListener('keydown', event => {
      const keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
      const name = keys[event.key];
      if (name || event.code === 'Space') event.preventDefault();
      if (name) turn(name);
      else if (event.code === 'Space') togglePause();
    });
    let touchStart = null;
    canvas.addEventListener('touchstart', event => { touchStart = [event.changedTouches[0].clientX, event.changedTouches[0].clientY]; }, { passive: true });
    canvas.addEventListener('touchend', event => {
      if (!touchStart) return;
      const dx = event.changedTouches[0].clientX - touchStart[0];
      const dy = event.changedTouches[0].clientY - touchStart[1];
      if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      touchStart = null;
    }, { passive: true });
    draw();
  </script>
</body>
</html>
